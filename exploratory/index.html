<!DOCTYPE html>
<html  lang="en" >
<head>
<meta charset="utf-8">
<title>Interactive test</title>
<link rel="author" title="r12a" href="mailto:ishida@w3.org">

<link rel="stylesheet" href="settings/metadata_styles.css"/>
<style>

:root {
  --bg-color: white;
  --text-color: black;
  --input-bg: white;
  --input-text: gray;
  --input-border: #ccc;
  --instruction-text: chocolate;
  --go-bg: aquamarine;
  --go-text: black;
  --link-color: #B95C22;
  --info-color: #777;
  --test-border: orange;
  --snapshot-bg: #1e883e;
  --snapshot-text: white;
}

[data-theme="dark"] {
  --bg-color: #121212;
  --text-color: #e0e0e0;
  --input-bg: #1e1e1e;
  --input-text: #ccc;
  --input-border: #444;
  --instruction-text: #ffb74d;
  --go-bg: #008b8b;
  --go-text: white;
  --link-color: #ffab91;
  --info-color: #aaa;
  --test-border: #ff9800;
}

body {
  background-color: var(--bg-color);
  color: var(--text-color);
}

#in, #css_settings {
  background-color: var(--input-bg);
  color: var(--input-text);
  border-color: var(--input-border);
}

#instructions, #assertion {
  background-color: var(--input-bg);
  color: var(--instruction-text);
  border-color: var(--input-border);
}

#go {
  background-color: var(--go-bg);
  color: var(--go-text);
}

#info {
  color: var(--info-color);
}

#info details {
  background-color: var(--input-bg);
}

#info a {
  color: var(--link-color);
}

#snapshotButton {
    color: var(--snapshot-text);
    background: var(--snapshot-bg);
}

/* the CSS below is not part of the test */
.test {
border-color: var(--test-border);
margin: 0px 2% 1rem 2%;
width: 500px;
height: 500px;
font-size: 36px;
border: 1px solid orange;
overflow: hidden;
}
#themeToggle {
    position: absolute;
    top: 1rem;
    right: 1rem;
    cursor: pointer;
    width: 2.5rem;
    height: 2.5rem;
    border-radius: 50%;
    border: 1px solid var(--input-border);
    background-color: var(--input-bg);
    color: var(--text-color);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    z-index: 100;
}
#themeToggle:hover {
    background-color: var(--input-border);
    transform: scale(1.05);
}
#snapshotButton {
    color: white;
    background: #1e883e;
    border-radius: .5em;
    border: 0;
    padding-block: .5rem;
    padding-inline: 1rem;
    font-size: 1rem;
    margin-block: 1rem;
    }
</style>
<style id="css_code"></style>
<script src="settings/interactive_functions.js"> </script>
</head>
<body>
<button onclick="toggleTheme()" id="themeToggle" aria-label="Toggle Dark Mode"></button>
<h1>Interactive test</h1>



<!-- INPUT AREA -->
<div><textarea id="assertion" placeholder="Add an assertion here." dir="auto"></textarea></div>
<div><textarea id="in" placeholder="Add here HTML code to be tested, then click on GO." dir="auto"></textarea>
<button onClick="setCSS(document.getElementById('css_settings').value); setText(document.getElementById('in').value);" id="go" style="vertical-align: top;">Go</button></div>






<!-- CSS -->
<div>
<textarea id="css_settings" placeholder="Add CSS code here.">.test {  }</textarea>
</div>



<div id="css_hints" style="margin-inline:1rem;">Hints: 
<select onchange="document.getElementById('hints').innerHTML = hints[this.value]">
<option value="none">Choose one...</option>
<option value="vertical">Vertical text</option>
<option value="bidi">Bidi text</option>

<option value="fonts">Fonts</option>
<option value="cursive">Cursive text</option>
<option value="transforms">Transforming characters</option>
<option value="grapheme">Grapheme/word segmentation &amp; selection</option>
<option value="decoration">Text decoration</option>
<option value="emphasis">Text emphasis</option>
<option value="quotations">Quotations</option>
<option value="annotations">Inline notes &amp; annotations</option>

<option value="breaking">Line breaking &amp; hyphenation</option>
<option value="justification">Text alignment &amp; justification</option>
<option value="spacing">Text spacing</option>
<option value="counters">Lists, counters, etc</option>
<option value="initials">Styling initials</option>
</select>

<div id="hints"></div>
</div>





<!-- TESTS -->
<div style="margin-inline: 1rem;"><textarea id="instructions" placeholder="Add instructions here." dir="auto"></textarea></div>

<div class="test" id="test" dir="auto"></div>




<!-- FONT SELECTOR -->
<div id="font_selector"></div>




<!-- CONTROLS -->
<div id="controls" style="margin-inline: 1rem;">

<div class="advice">Adjust the width of the test box.<br/>
<input id="boxWidth" min="10" max="1000" step="1" value="500" oninput="setBoxWidth(this.value)" style="width:90%; margin-left: 5%;" type="range"> <span id="wSizeIndicator" style="font-size:80%;">500</span>px</div>

<div class="advice">Adjust the height of the test box.<br/>
<input id="boxHeight" min="10" max="1000" step="1" value="500" oninput="setBoxHeight(this.value)" style="width:90%; margin-left: 5%;" type="range"> <span id="vSizeIndicator" style="font-size:80%;">500</span>px</div>

<p class="advice">Set the language <input id="language" type="text" onChange="setLanguage(this.value)"/> <button onClick="setLanguage(document.getElementById('language').value)">Apply</button></p>

<p class="advice">Set font size&nbsp;<input id="fontSize" min="10" max="120" step="1" value="36" oninput="setFontSize(this.value)" type="range"/> 
<span id="sizeOfFont" style="font-size:80%;">36</span>px</p>

<p class="advice">Set the font to <input id="fontFamily" type="text" onChange="setFont(this.value)"/> <button onClick="setFont(document.getElementById('fontFamily').value)">Apply</button></p>
</div>





<!-- INFO -->
<div id="info" class="notes" style="clear: both; position:inherit; margin-inline: 1rem; margin-block: 3rem;">
<p>More tests: 
<a href="https://www.w3.org/International/i18n-tests/#results_summary_pages">All interactive tests &amp; results</a>
</p>

<p><img src="settings/copy.svg" alt="Copy!" style="cursor: pointer; height: 2rem;" onClick="navigator.clipboard.writeText(document.getElementById('version').textContent).then(()=>{ const s = document.getElementById('copyStatus'); if (s) { s.textContent='Copied!'; s.style.color='#2a7b2e'; clearTimeout(s._t); s._t=setTimeout(()=>{ s.textContent=''; }, 2000); } }).catch(()=>{ const s = document.getElementById('copyStatus'); if (s) { s.textContent='Copy failed'; s.style.color='#b3261e'; clearTimeout(s._t); s._t=setTimeout(()=>{ s.textContent=''; }, 3000); } })"> &nbsp; Browser: <span id="version"></span> <span id="copyStatus" aria-live="polite" style="font-size: .9rem; margin-inline-start: .5rem;"></span></p>

<p><button id="snapshotButton" onClick="document.getElementById('snapshot').value = snapParameters(); document.getElementById('snapshot').select()">Take a snapshot</button> &nbsp; <input id="snapshot" style="width:50em; height: 1.8rem; font-size: 1.2rem;"></p>
</div>




<script>
function toggleTheme() {
  const currentTheme = document.documentElement.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('theme', newTheme);
  updateThemeButton(newTheme);
}

function updateThemeButton(theme) {
    const btn = document.getElementById('themeToggle');
    if (!btn) return;

    if (theme === 'dark') {
        // Currently Dark, switch to Light. Show Sun.
        btn.innerHTML = `
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: block;">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
        `;
    } else {
        // Currently Light, switch to Dark. Show Moon.
        btn.innerHTML = `
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: block;">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
        `;
    }
}

// Init theme
const savedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
document.documentElement.setAttribute('data-theme', savedTheme);
window.addEventListener('DOMContentLoaded', () => {
    updateThemeButton(document.documentElement.getAttribute('data-theme'));
});

document.getElementById('version').innerHTML = navigator.userAgent

// check for parameters and take appropriate action
parameters = location.search.split('&')
parameters[0] = parameters[0].substring(1)
for (var p=0;p<parameters.length;p++) {  
	pairs = parameters[p].split('=');
	if (pairs[0] == 'text' && pairs[1]) { 
					document.getElementById('in').value = decodeURIComponent(pairs[1])
					setText(decodeURIComponent(pairs[1]))
					}
	if (pairs[0] == 'css' && pairs[1]) { 
					document.getElementById('css_settings').value = decodeURIComponent(pairs[1])
					setCSS(decodeURIComponent(pairs[1]))
					}

	if (pairs[0] == 'a' && pairs[1]) { 
					document.getElementById('assertion').value = decodeURIComponent(pairs[1])
					}
	if (pairs[0] == 'i' && pairs[1]) { 
					document.getElementById('instructions').value = decodeURIComponent(pairs[1])
					}

	if (pairs[0] == 'lang' && pairs[1]) setLanguage( pairs[1] )
	if (pairs[0] == 'fontSize' && pairs[1]) {
					setFontSize(pairs[1]) 
					document.getElementById('fontSize').value = pairs[1] 
					}
	if (pairs[0] == 'fontFamily' && pairs[1]) {
					setFont(decodeURIComponent(pairs[1]))
					document.getElementById('fontFamily').value = decodeURIComponent(pairs[1]) 
					}
	if (pairs[0] == 'width' && pairs[1]) { 
					setBoxWidth(pairs[1]) 
					document.getElementById('boxWidth').value = pairs[1]
					}
	if (pairs[0] == 'height' && pairs[1]) { 
					setBoxHeight(pairs[1]) 
					document.getElementById('boxHeight').value = pairs[1]
					}
	if (pairs[0] == 'fonts' && pairs[1]) { 
					buildFontList(decodeURIComponent(pairs[1]))
					}
    }




function buildFontList(input) {
    const container = document.getElementById("font_selector")
    if (!container) return

    const items = input.split(",").map(s => s.trim())
    let html = `<div class="advice">Mouse over or tap on a font name to apply it.</div><div id="fontlist">`
    let currentLine = ""

    items.forEach(item => {
        if (item.toLowerCase().startsWith("title:")) {
            // Flush previous line if it exists
            if (currentLine) {
                html += `<p>${currentLine}</p>`
                currentLine = ""
                }
            const title = item.slice(6).trim()
            currentLine = `<strong>${title}</strong>`
            }
        else {
            const safeFont = item.replace(/"/g, '&quot;');
            const span = `
            <span 
              style="cursor:pointer"
              onmouseover="document.getElementById('test').style.fontFamily='${safeFont}'"
              onclick="document.getElementById('test').style.fontFamily='${safeFont}'"
            >${safeFont}</span>
            `;
            currentLine += ` • ${span}`
            }
        })

    // Flush final line
    if (currentLine) {
    html += `<p>${currentLine}</p></div>`
    }

    container.innerHTML = html
    }



function extractFontList() {
  const container = document.getElementById("fontlist")
  if (!container) return ""

  const paragraphs = container.querySelectorAll("p")
  const output = []

  paragraphs.forEach(p => {
    const strong = p.querySelector("strong")
    if (!strong) return

    // Title
    const title = strong.textContent.trim()
    output.push("title:" + title)

    // Fonts
    const spans = p.querySelectorAll("span")
    spans.forEach(span => {
      const font = span.textContent.trim()
      output.push(font)
      })
    })

  return output.join(",")
  }





function snapParameters () {
// take a snapshot of the settings of the page and make available as URL parameters
// this can be picked up by the user to point to the current setup of the page

out = "https://w3c.github.io/i18n-tests/exploratory/index.html?"
out += 'text='+encodeURIComponent(document.getElementById('in').value)
out += '&css='+encodeURIComponent(document.getElementById('css_settings').value)

if (document.getElementById('language') && document.getElementById('language').value != '') out += '&lang='+document.getElementById('language').value
if (document.getElementById('fontSize') && document.getElementById('fontSize').value != '') out += '&fontSize='+document.getElementById('fontSize').value
if (document.getElementById('fontFamily') && document.getElementById('fontFamily').value != '') out += '&fontFamily='+encodeURIComponent(document.getElementById('fontFamily').value)
if (document.getElementById('boxWidth')) out += '&width='+document.getElementById('boxWidth').value
if (document.getElementById('boxHeight')) out += '&height='+document.getElementById('boxHeight').value

out += '&a='+encodeURIComponent(document.getElementById('assertion').value)
out += '&i='+encodeURIComponent(document.getElementById('instructions').value)

if (document.getElementById('fontlist') && document.getElementById('fontlist').textContent !== '') out += `&fonts=${ encodeURIComponent(extractFontList()) }`

return out
}




// Auto-sync with debounce function
let debounceTimer;
function debounce(func, delay) {
	return function() {
		const context = this;
		const args = arguments;
		clearTimeout(debounceTimer);
		debounceTimer = setTimeout(() => func.apply(context, args), delay);
	}
}

// Auto-update preview when HTML or CSS changes
function updatePreview() {
	setCSS(document.getElementById('css_settings').value);
	setText(document.getElementById('in').value);
}

// Add event listeners for auto-sync (with 500ms debounce)
document.getElementById('in').addEventListener('input', debounce(updatePreview, 500));
document.getElementById('css_settings').addEventListener('input', debounce(updatePreview, 500));

</script>
</body>
</html>
